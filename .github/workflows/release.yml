name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

      - name: Verify the manifest version matches the tag
        run: |
          manifest=$(node -p "require('./module.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "module.json version ($manifest) does not match tag ($tag)" >&2
            exit 1
          fi

      - name: Verify the download URL points at this tag
        run: |
          expected="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip"
          actual=$(node -p "require('./module.json').download")
          if [ "$actual" != "$expected" ]; then
            echo "module.json download ($actual) does not match $expected" >&2
            exit 1
          fi

      - name: Build the package
        run: npm run build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" module.zip module.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
